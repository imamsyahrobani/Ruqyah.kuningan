    <meta property="og:title" content="Ruqyah Kuningan - Layanan & Penjadwalan Terapi Syar'iyyah" />
    <meta property="og:description" content="Aplikasi layanan terapi Ruqyah Syar'iyyah dan Thibbun Nabawi di Kuningan, Jawa Barat dengan sistem penjadwalan pasien online, tes skrining mandiri, dan direktori doa ruqyah." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox/iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var message = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          message.includes('WebSocket') ||
          message.includes('@vite/client') ||
          message.includes('ws://') ||
          message.includes('wss://')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var message = (event && (event.message || '')) || '';
        if (
          message.includes('WebSocket') ||
          message.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
